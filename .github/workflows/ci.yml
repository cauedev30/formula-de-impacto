name: ci

on:
  push:
  pull_request:

jobs:
  teste:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 20 fica fora: `node --test 'test/*.test.mjs'` só expande o glob a partir do 21.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: test -f out/index.html
